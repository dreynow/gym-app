name: Tests

# Runs unit tests (Vitest) and the Playwright end-to-end suite (real browser,
# full app) on pull requests, so regressions get caught before merge. On pushes
# to the deploy branch the same suite runs inside the "Test and deploy"
# workflow and gates the deploy, so there is no need to duplicate it here.
on:
  pull_request:
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Unit tests
        run: npm test
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Run E2E tests
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
