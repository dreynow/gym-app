name: Test and deploy

# Runs the full test suite, then (only if it passes) builds the PWA and deploys
# it to AWS: syncs the static build to S3 and invalidates the CloudFront
# distribution that serves https://rack.daresunday.com. Tests gate the deploy,
# so a red build never ships.
on:
  push:
    branches: ['claude/kind-clarke-exE3K']
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time; newer pushes supersede in-flight ones.
concurrency:
  group: 'deploy'
  cancel-in-progress: true

env:
  S3_BUCKET: rack-app-280012167843
  CLOUDFRONT_DISTRIBUTION_ID: E3ITMFSEAL4BIY
  AWS_REGION: us-east-1

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Unit tests
        run: npm test
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Run E2E tests
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Root base path (default) for the custom domain.
      - name: Build
        run: npm run build
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Sync to S3
        run: aws s3 sync dist/ "s3://${S3_BUCKET}/" --delete
      - name: Invalidate CloudFront
        run: aws cloudfront create-invalidation --distribution-id "${CLOUDFRONT_DISTRIBUTION_ID}" --paths '/*'
