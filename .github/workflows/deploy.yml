name: Deploy to GitHub Pages

# Builds the PWA on GitHub's runners and publishes it to GitHub Pages.
# No local toolchain needed: pushing to the branch (or running this manually
# via "Run workflow") deploys the site.
on:
  push:
    branches: ['claude/kind-clarke-exE3K']
  workflow_dispatch:

# Permissions required by the Pages deploy.
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; newer pushes supersede in-flight ones.
concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build (with Pages base path)
        run: npm run build
        env:
          # Project site lives at https://<owner>.github.io/gym-app/
          BASE_PATH: /gym-app/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
