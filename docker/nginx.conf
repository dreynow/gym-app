server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # gzip text assets
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json;
  gzip_min_length 1024;

  # The PWA service worker must never be cached, so updates roll out.
  location = /sw.js {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    expires off;
  }
  location = /registerSW.js {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    expires off;
  }
  location = /manifest.webmanifest {
    types { application/manifest+json webmanifest; }
    default_type application/manifest+json;
  }

  # Hashed build assets (and fonts) are immutable: cache hard.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
  location /fonts/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    types { font/woff2 woff2; }
    default_type font/woff2;
  }

  # SPA fallback. The app uses a hash router so this is belt-and-braces.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
